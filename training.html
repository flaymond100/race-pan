<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Plan</title>
<style>
  :root[data-theme="light"] {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --border: #e0e0d8;
    --text: #1a1a1a;
    --text-muted: #666;
    --accent: #2d6a4f;
    --accent-light: #e8f5ee;
    --heading: #1a3a2a;
    --toggle-bg: #2d6a4f;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  :root[data-theme="dark"] {
    --bg: #0f1612;
    --surface: #1a2420;
    --border: #2a3830;
    --text: #e8f0ec;
    --text-muted: #8a9e96;
    --accent: #52b788;
    --accent-light: #1a2e24;
    --heading: #74c69d;
    --toggle-bg: #52b788;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    transition: background 0.2s, color 0.2s;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: var(--shadow);
  }

  .logo {
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  .logo span { color: var(--text-muted); font-weight: 400; }

  .toggle {
    background: var(--toggle-bg);
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 0.8rem;
    color: white;
    font-weight: 600;
    letter-spacing: 0.03em;
    transition: opacity 0.2s;
  }
  .toggle:hover { opacity: 0.85; }

  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  h1 {
    font-size: 1.9rem;
    color: var(--heading);
    margin: 0 0 16px;
    font-weight: 800;
    letter-spacing: -0.03em;
  }

  p { color: var(--text-muted); }
</style>
</head>
<body>
<header>
  <div class="logo">🚴 Athlete Notes <span>/ training plan</span></div>
  <button class="toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
</header>
<main>
  <h1>Test</h1>
  <p>Training plan content coming soon.</p>
</main>
<script>
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeBtn').textContent = isDark ? '🌙 Dark' : '☀️ Light';
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
  }

  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️ Light' : '🌙 Dark';
  });
</script>
</body>
</html>
