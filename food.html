<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Итальянское меню на неделю</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F3ED;
    --cream-dark: #EDE7DB;
    --ink: #1A1714;
    --ink-light: #4A4540;
    --ink-muted: #8A8078;
    --terracotta: #C4623A;
    --terracotta-light: #E8896A;
    --basil: #3D6B4F;
    --basil-light: #6A9B7E;
    --gold: #C8922A;
    --gold-light: #F0C870;
    --border: rgba(26,23,20,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--cream); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; font-weight: 300; min-height: 100vh; }

  header { background: var(--ink); color: var(--cream); padding: 2.5rem 2rem 2rem; text-align: center; position: relative; overflow: hidden; }
  header::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(45deg,transparent,transparent 40px,rgba(255,255,255,0.015) 40px,rgba(255,255,255,0.015) 41px); }
  .header-eyebrow { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold-light); margin-bottom: 0.6rem; font-weight: 400; }
  header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 400; line-height: 1.15; margin-bottom: 0.4rem; }
  header h1 em { color: var(--terracotta-light); font-style: italic; }
  .header-sub { font-size: 13px; color: rgba(247,243,237,0.5); font-weight: 300; }

  nav { background: var(--cream-dark); border-bottom: 1px solid var(--border); padding: 0 1rem; display: flex; overflow-x: auto; scrollbar-width: none; position: sticky; top: 0; z-index: 100; }
  nav::-webkit-scrollbar { display: none; }
  .nav-btn { padding: 1rem 1.1rem 0.85rem; border: none; background: transparent; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 400; color: var(--ink-muted); white-space: nowrap; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; position: relative; top: 1px; }
  .nav-btn:hover { color: var(--ink); }
  .nav-btn.active { color: var(--terracotta); border-bottom-color: var(--terracotta); font-weight: 500; }

  main { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  .day-header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .day-name { font-family: 'Playfair Display', serif; font-size: 1.9rem; font-weight: 400; }
  .day-kcal { font-size: 12px; color: var(--ink-muted); background: var(--cream-dark); padding: 4px 10px; border-radius: 99px; }

  .carb-note { background: var(--cream-dark); border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; padding: 0.85rem 1.1rem; font-size: 13px; color: var(--ink-light); line-height: 1.65; margin-bottom: 1.5rem; }

  /* COOK-ONCE BANNER */
  .cook-banner { background: var(--basil); color: white; border-radius: 10px; padding: 0.8rem 1.1rem; font-size: 13px; line-height: 1.6; margin-bottom: 1.5rem; display: flex; gap: 10px; align-items: flex-start; }
  .cook-banner-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

  .meals-grid { display: flex; flex-direction: column; gap: 10px; }

  .meal-card { background: white; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: border-color 0.2s; cursor: pointer; }
  .meal-card:hover { border-color: rgba(196,98,58,0.35); }
  .meal-card.reuse { border-left: 3px solid var(--basil-light); }

  .meal-top { padding: 1rem 1.2rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .meal-top-header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .slot-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); line-height: 1.4; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .meal-name { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 400; margin-bottom: 0.25rem; line-height: 1.3; }
  .meal-desc { font-size: 13px; color: var(--ink-light); line-height: 1.6; font-weight: 300; word-break: break-word; }
  .meal-desc .kid-note { color: var(--basil); font-style: italic; }
  .reuse-badge { font-size: 11px; background: #EAF4EE; color: #27500A; padding: 3px 9px; border-radius: 99px; font-weight: 500; display: inline-block; max-width: 100%; white-space: normal; line-height: 1.4; margin-top: 4px; }

  .macros { display: flex; flex-direction: row; flex-wrap: wrap; gap: 5px; }
  .macro-tag { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .tag-c { background: #EDF4FB; color: #1A5276; }
  .tag-p { background: #EAF4EE; color: #1D5631; }
  .tag-f { background: #FEF5E7; color: #7D5A0A; }

  /* RECIPE PANEL */
  .recipe-panel { display: none; border-top: 1px solid var(--border); background: #FAFAF7; padding: 1.2rem 1.4rem 1.4rem; }
  .recipe-panel.open { display: block; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  .recipe-grid { display: grid; grid-template-columns: 1fr 1.6fr; gap: 1.5rem; }
  .recipe-section-title { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 0.6rem; font-weight: 500; }
  .ingredient-list { list-style: none; }
  .ingredient-list li { font-size: 13px; color: var(--ink-light); padding: 4px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; }
  .ingredient-list li:last-child { border-bottom: none; }
  .ing-name { font-weight: 400; }
  .ing-qty { color: var(--ink-muted); font-size: 12px; white-space: nowrap; }

  .steps-list { list-style: none; counter-reset: steps; }
  .steps-list li { font-size: 13px; color: var(--ink-light); line-height: 1.65; padding: 6px 0 6px 2rem; border-bottom: 1px solid var(--border); position: relative; counter-increment: steps; font-weight: 300; }
  .steps-list li:last-child { border-bottom: none; }
  .steps-list li::before { content: counter(steps); position: absolute; left: 0; top: 7px; width: 18px; height: 18px; background: var(--terracotta); color: white; border-radius: 50%; font-size: 10px; font-weight: 500; display: flex; align-items: center; justify-content: center; }

  .recipe-tip { margin-top: 1rem; background: rgba(200,146,42,0.1); border-radius: 8px; padding: 0.7rem 1rem; font-size: 12px; color: var(--ink-light); line-height: 1.6; }
  .recipe-tip strong { font-weight: 500; color: var(--gold); }

  .toggle-arrow { font-size: 13px; color: var(--ink-muted); transition: transform 0.25s; display: inline-block; margin-left: 4px; }
  .meal-card.expanded .toggle-arrow { transform: rotate(180deg); }

  .day-summary { margin-top: 1.4rem; background: var(--ink); color: var(--cream); border-radius: 12px; padding: 1.1rem 1.4rem; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; text-align: center; }
  .summary-val { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 400; color: var(--gold-light); }
  .summary-lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(247,243,237,0.45); margin-top: 2px; }

  /* SHOPPING */
  .shop-intro { background: var(--terracotta); color: white; border-radius: 12px; padding: 1.4rem; margin-bottom: 1.8rem; font-size: 14px; line-height: 1.6; }
  .shop-intro strong { font-weight: 500; }
  .shop-section-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 400; color: var(--ink); margin: 1.6rem 0 0.7rem; display: flex; align-items: center; gap: 0.5rem; }
  .shop-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .shop-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 6px; }
  .shop-item { font-size: 13px; padding: 7px 12px; background: white; border: 1px solid var(--border); border-radius: 8px; color: var(--ink-light); font-weight: 300; display: flex; align-items: center; gap: 7px; }
  .shop-item::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--terracotta-light); flex-shrink: 0; }

  @media (max-width: 580px) {
    .recipe-grid { grid-template-columns: 1fr; }
    .day-summary { grid-template-columns: repeat(2, 1fr); }
    .recipe-panel { padding: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-eyebrow">Семейный план питания · Итальянская кухня</div>
  <h1>Меню на <em>неделю</em></h1>
  <div class="header-sub">2 взрослых + ребёнок 4 лет &nbsp;·&nbsp; Нажмите на блюдо, чтобы открыть рецепт</div>
</header>

<nav>
  <button class="nav-btn active" onclick="show('mon',this)">Пн</button>
  <button class="nav-btn" onclick="show('tue',this)">Вт</button>
  <button class="nav-btn" onclick="show('wed',this)">Ср</button>
  <button class="nav-btn" onclick="show('thu',this)">Чт</button>
  <button class="nav-btn" onclick="show('fri',this)">Пт</button>
  <button class="nav-btn" onclick="show('sat',this)">Сб</button>
  <button class="nav-btn" onclick="show('sun',this)">Вс</button>
  <button class="nav-btn" onclick="show('shop',this)">🛒 Покупки</button>
</nav>

<main id="main"></main>

<script>
const days = {
  mon: {

      {

          ["Маскарпоне", "2 ст.л."],["Греческий йогурт", "100 г"],["Какао несладкое", "1 ч.л."],["Мёд", "1 ч.л."]
        ],
        steps: [
          "Вечером смешайте овсянку с овсяным молоком и эспрессо в банке или миске. Накройте и уберите в холодильник на ночь.",
          "Взбейте маскарпоне с йогуртом и мёдом до однородности.",

        c:90, p:28, f:12, kcal:580,
        ingredients: [
          ["Дitalini (или другая мелкая паста)", "120 г сухой"],["Фасоль канеллини", "1 банка 400 г"],
          ["Пассата / рубленые томаты", "300 мл"],["Лук репчатый", "1 шт"],["Морковь", "1 шт"],

        steps: ["Достаньте банку из холодильника.", "Добавьте свежую ложку маскарпоне с мёдом поверх, посыпьте какао.", "Готово за 2 минуты."],

function toggleRecipe(card) {
  const panel = card.querySelector('.recipe-panel');
  const isOpen = card.classList.contains('expanded');
  // close all
  document.querySelectorAll('.meal-card').forEach(c => {
    c.classList.remove('expanded');
    c.querySelector('.recipe-panel').classList.remove('open');
  });
  if (!isOpen) {
    card.classList.add('expanded');
    panel.classList.add('open');
  }
}

function renderDay(key) {
  const d = days[key];
  let totalKcal = 0, totalC = 0, totalP = 0, totalF = 0;
  d.meals.forEach(m => { totalKcal += m.kcal; totalC += m.c; totalP += m.p; totalF += m.f; });

  let html = `<div class="carb-note">Углеводы — <strong>базовые</strong> цифры при стандартной порции. Порцию пасты, риса, хлеба регулируйте сами под нагрузку.</div>`;

  if (d.banner) {
    html += `<div class="cook-banner"><span class="cook-banner-icon">${d.banner.icon}</span><span>${d.banner.text}</span></div>`;
  }

  html += `<div class="day-header"><div class="day-name">${d.name}</div><span class="day-kcal">~${totalKcal} ккал / взрослый</span></div>`;
  html += `<div class="meals-grid">`;

  d.meals.forEach((m, i) => {
    const isReuse = m.reuse !== null;
    html += `<div class="meal-card${isReuse ? ' reuse' : ''}" onclick="toggleRecipe(this)">
      <div class="meal-top">
        <div class="meal-top-header">
          <span class="slot-label">${m.slot} <span class="toggle-arrow">▾</span></span>
          <div class="macros">
            <span class="macro-tag tag-c">У ${m.c}г</span>
            <span class="macro-tag tag-p">Б ${m.p}г</span>
            <span class="macro-tag tag-f">Ж ${m.f}г</span>
          </div>
        </div>
        <div class="meal-name">${m.name}</div>
        <div class="meal-desc">${m.desc}</div>
        ${m.reuse ? `<span class="reuse-badge">♻ ${m.reuse}</span>` : ''}
      </div>
      <div class="recipe-panel">
        <div class="recipe-grid">
          <div>
            <div class="recipe-section-title">Ингредиенты (на семью)</div>
            <ul class="ingredient-list">
              ${m.ingredients.map(([n,q]) => `<li><span class="ing-name">${n}</span><span class="ing-qty">${q}</span></li>`).join('')}
            </ul>
          </div>
          <div>
            <div class="recipe-section-title">Приготовление</div>
            <ol class="steps-list">
              ${m.steps.map(s => `<li>${s}</li>`).join('')}
            </ol>
            ${m.tip ? `<div class="recipe-tip"><strong>Совет:</strong> ${m.tip}</div>` : ''}
          </div>
        </div>
      </div>
    </div>`;
  });

  html += `</div>
    <div class="day-summary">
      <div><div class="summary-val">${totalKcal}</div><div class="summary-lbl">ккал</div></div>
      <div><div class="summary-val">${totalC}г</div><div class="summary-lbl">углеводы</div></div>
      <div><div class="summary-val">${totalP}г</div><div class="summary-lbl">белок</div></div>
      <div><div class="summary-val">${totalF}г</div><div class="summary-lbl">жиры</div></div>
    </div>`;
  return html;
}

function renderShop() {
  let html = `<div class="day-header"><div class="day-name">Список покупок</div></div>
    <div class="shop-intro">
      <strong>Закупайтесь сегодня — хватит на всю неделю.</strong><br>
      Проверьте запасы оливкового масла, консервов и сухой пасты перед походом. 
      Бюджет: около €100–130 в Rewe или Edeka. Дрожжи нужны дважды: тесто для пиццы (пятница) и корнетто (суббота вечером → воскресное утро).
    </div>`;

  shopping.forEach(s => {
    html += `<div class="shop-section-title">${s.icon} ${s.title}</div><div class="shop-items">`;
    s.items.forEach(i => { html += `<div class="shop-item">${i}</div>`; });
    html += `</div>`;
  });
  return html;
}

function show(key, btn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('main').innerHTML = key === 'shop' ? renderShop() : renderDay(key);
}

show('mon', document.querySelector('.nav-btn'));
