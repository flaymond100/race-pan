<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athlete Notes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root[data-theme="light"] {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --border: #e0e0d8;
    --text: #1a1a1a;
    --text-muted: #666;
    --accent: #2d6a4f;
    --accent-light: #e8f5ee;
    --heading: #1a3a2a;
    --code-bg: #f0f0eb;
    --table-head: #e8f5ee;
    --table-stripe: #fafaf7;
    --toggle-bg: #2d6a4f;
    --toggle-icon: "☀️";
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  :root[data-theme="dark"] {
    --bg: #0f1612;
    --surface: #1a2420;
    --border: #2a3830;
    --text: #e8f0ec;
    --text-muted: #8a9e96;
    --accent: #52b788;
    --accent-light: #1a2e24;
    --heading: #74c69d;
    --code-bg: #141f1b;
    --table-head: #1a2e24;
    --table-stripe: #151e1a;
    --toggle-bg: #52b788;
    --toggle-icon: "🌙";
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    transition: background 0.2s, color 0.2s;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: var(--shadow);
  }

  .logo {
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  .logo span { color: var(--text-muted); font-weight: 400; }

  .toggle {
    background: var(--toggle-bg);
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 0.8rem;
    color: white;
    font-weight: 600;
    letter-spacing: 0.03em;
    transition: opacity 0.2s;
  }
  .toggle:hover { opacity: 0.85; }

  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  #content h1 { font-size: 1.9rem; color: var(--heading); margin: 0 0 8px; font-weight: 800; letter-spacing: -0.03em; }
  #content h2 { font-size: 1.3rem; color: var(--heading); margin: 40px 0 12px; font-weight: 700; padding-bottom: 6px; border-bottom: 2px solid var(--accent); }
  #content h3 { font-size: 1.05rem; color: var(--accent); margin: 28px 0 10px; font-weight: 700; }
  #content h4 { font-size: 0.95rem; color: var(--text-muted); margin: 20px 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

  #content p { margin: 0 0 14px; color: var(--text); }
  #content ul, #content ol { margin: 0 0 14px 20px; }
  #content li { margin-bottom: 6px; }
  #content strong { color: var(--heading); font-weight: 700; }
  #content em { color: var(--text-muted); }

  #content blockquote {
    border-left: 3px solid var(--accent);
    background: var(--accent-light);
    margin: 16px 0;
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  #content code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.88em;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--accent);
  }

  #content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    margin: 0 0 16px;
  }
  #content pre code { background: none; padding: 0; color: var(--text); }

  #content table {
    width: 100%;
    border-collapse: collapse;
    margin: 0 0 20px;
    font-size: 0.92rem;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  #content th {
    background: var(--table-head);
    color: var(--heading);
    padding: 10px 14px;
    text-align: left;
    font-weight: 700;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  #content td { padding: 10px 14px; border-top: 1px solid var(--border); vertical-align: top; }
  #content tr:nth-child(even) td { background: var(--table-stripe); }

  #content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

  .loading, .error {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 50vh;
    gap: 12px;
    color: var(--text-muted);
    font-size: 0.95rem;
  }
  .loading::before { content: ''; width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .updated {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
</style>
</head>
<body>
<header>
  <div class="logo">🚴 Athlete Notes <span>/ race prep</span></div>
  <button class="toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
</header>
<main>
  <div id="content"><div class="loading"></div></div>
</main>
<script>
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('themeBtn').textContent = isDark ? '🌙 Dark' : '☀️ Light';
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
  }

  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('themeBtn').textContent = saved === 'dark' ? '☀️ Light' : '🌙 Dark';
  });

  async function loadNotes() {
    const el = document.getElementById('content');
    try {
      const res = await fetch('./notes.md?v=' + Date.now());
      if (!res.ok) throw new Error(res.status);
      const md = await res.text();
      el.innerHTML = `<div class="updated">Last loaded: ${new Date().toLocaleString()}</div>` + marked.parse(md);
    } catch(e) {
      el.innerHTML = `<div class="error">⚠️ Could not load notes.md<br><small>Make sure the file is in the same folder as index.html</small></div>`;
    }
  }
  loadNotes();
</script>
</body>
</html>
