<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athlete Reminders</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --border: #e0e0d8;
    --text: #1a1a1a;
    --text-muted: #666;
    --accent: #e85d04;
    --accent-soft: #fff3ee;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --radius: 12px;
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #111318;
    --surface: #1c1f26;
    --border: #2a2d35;
    --text: #e8e8e8;
    --text-muted: #888;
    --accent: #ff7a35;
    --accent-soft: #2a1a10;
    --shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.25s, color 0.25s;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: -0.3px;
  }
  .logo svg { width: 26px; height: 26px; }
  .controls { display: flex; align-items: center; gap: 12px; }
  .theme-btn {
    background: var(--accent-soft);
    border: 1px solid var(--border);
    color: var(--accent);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .theme-btn:hover { opacity: 0.8; }
  .upload-btn {
    background: var(--accent);
    border: none;
    color: #fff;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .upload-btn:hover { opacity: 0.85; }
  #file-input { display: none; }
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }
  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
  .empty-state h2 { font-size: 1.3rem; margin-bottom: 8px; color: var(--text); }
  .empty-state p { font-size: 0.9rem; line-height: 1.6; }
  .empty-state code {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.85rem;
  }
  /* Markdown content styles */
  .md-body h1 {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--accent);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 10px;
    margin-bottom: 24px;
    margin-top: 0;
  }
  .md-body h2 {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text);
    margin-top: 36px;
    margin-bottom: 14px;
    padding: 10px 14px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
  }
  .md-body h3 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent);
    margin-top: 24px;
    margin-bottom: 10px;
  }
  .md-body p {
    font-size: 0.95rem;
    line-height: 1.75;
    margin-bottom: 14px;
    color: var(--text);
  }
  .md-body ul, .md-body ol {
    padding-left: 20px;
    margin-bottom: 14px;
  }
  .md-body li {
    font-size: 0.95rem;
    line-height: 1.75;
    margin-bottom: 4px;
  }
  .md-body table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
    font-size: 0.9rem;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .md-body th {
    background: var(--accent);
    color: #fff;
    padding: 10px 14px;
    text-align: left;
    font-weight: 600;
  }
  .md-body td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .md-body tr:last-child td { border-bottom: none; }
  .md-body tr:nth-child(even) td { background: var(--accent-soft); }
  .md-body code {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.85rem;
    color: var(--accent);
  }
  .md-body pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    overflow-x: auto;
    margin-bottom: 16px;
  }
  .md-body pre code {
    background: none;
    border: none;
    padding: 0;
    color: var(--text);
    font-size: 0.88rem;
  }
  .md-body blockquote {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    margin: 0 0 16px 0;
    padding: 10px 16px;
    border-radius: 0 8px 8px 0;
    color: var(--text-muted);
    font-style: italic;
    font-size: 0.93rem;
  }
  .md-body hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0;
  }
  .md-body strong { color: var(--text); font-weight: 700; }
  .md-body a { color: var(--accent); text-decoration: none; }
  .md-body a:hover { text-decoration: underline; }
  .filename-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </svg>
    Athlete Reminders
  </div>
  <div class="controls">
    <button class="theme-btn" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span>
      <span id="theme-label">Dark</span>
    </button>
    <button class="upload-btn" onclick="document.getElementById('file-input').click()">
      📄 Load .md file
    </button>
    <input type="file" id="file-input" accept=".md,.markdown,.txt" onchange="loadFile(event)">
  </div>
</header>

<main id="main">
  <div class="empty-state">
    <div class="icon">🚴</div>
    <h2>No file loaded yet</h2>
    <p>Click <strong>Load .md file</strong> above to load your markdown reminders.<br><br>
    Just paste your Claude recommendations into a <code>.md</code> file,<br>
    save it, and load it here anytime.</p>
  </div>
</main>

<script>
  // Theme
  const saved = localStorage.getItem('theme') || 'light';
  setTheme(saved);

  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('theme-icon').textContent = t === 'dark' ? '☀️' : '🌙';
    document.getElementById('theme-label').textContent = t === 'dark' ? 'Light' : 'Dark';
    localStorage.setItem('theme', t);
  }

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    setTheme(cur === 'dark' ? 'light' : 'dark');
  }

  // File loading
  function loadFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => renderMarkdown(ev.target.result, file.name);
    reader.readAsText(file);
  }

  function renderMarkdown(text, filename) {
    const main = document.getElementById('main');
    main.innerHTML = `
      <div class="filename-badge">📄 ${filename}</div>
      <div class="md-body">${marked.parse(text)}</div>
    `;
  }
</script>
</body>
</html>
